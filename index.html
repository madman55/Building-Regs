<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building Regs Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Building Regs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: playful and quick like a language app, but every answer cites its source.
   IDEA: the course is a building you climb — each Approved Document is a storey, lessons wind up the stair core.
   PICTURE: the winding lesson path with chunky 3D buttons, chests and storey bands.
   COLOUR and TYPE: white sheet, drawing ink, hi-vis yellow bands, ultramarine action, teal gems; Archivo wide + Inter.
   LAYOUT: phone column, sticky stats bar, bottom tab bar, full-screen lessons with a sliding answer sheet. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111315);--ink:light-dark(#15171a,#eef0f2);--mute:light-dark(#5d6470,#9aa3ad);
--line:light-dark(#e3e6ea,#2b2f34);--line2:light-dark(#cfd4da,#3a3f45);--card:light-dark(#f4f5f7,#1b1e22);
--hv:#ffd400;--hvDk:#c9a600;--hvInk:#15171a;--act:light-dark(#2b45ff,#6f82ff);--actDk:light-dark(#1c2fc0,#4a5ee0);--actBg:light-dark(#eef0ff,#1d2240);
--gem:light-dark(#0a9fb8,#3fd0e6);--fire:#ff8a00;
--ok:light-dark(#14894f,#3ecf86);--okDk:light-dark(#0c5c35,#239a5e);--okBg:light-dark(#e3f6ec,#12301f);
--bad:light-dark(#d2302a,#ff6b63);--badDk:light-dark(#8f1d18,#b8403a);--badBg:light-dark(#fde8e6,#3a1714)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.wd{font-family:Archivo,Inter,sans-serif;font-stretch:112%;font-weight:800;line-height:1.05;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.bar .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.bar h1{font-size:16px;flex:1}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat svg{width:22px;height:22px}.fl{color:var(--fire)}.ht{color:var(--bad)}.gm{color:var(--gem)}.bo{color:var(--act)}
.fl.off{color:var(--line2)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute)}
.tab svg{width:26px;height:26px}.tab.on{color:var(--act)}
.tab.on svg{transform:scale(1.08)}
.card{margin:16px 0;padding:16px;border-radius:18px;border:2px solid var(--line)}
.card h2{font-size:22px;margin-bottom:4px}
.small{font-size:13px;color:var(--mute)}
.meter{height:16px;border-radius:8px;background:var(--line);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:8px;background:var(--hv);transition:width .5s cubic-bezier(.3,1.4,.6,1)}
.meter i:after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:2px;background:#fff6;width:0}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--act);color:#fff;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--actDk);margin-top:10px;transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--actDk)}
.btn.ghost{background:var(--bg);color:var(--act);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.gemb{background:var(--gem);box-shadow:0 4px 0 light-dark(#067083,#1f97aa)}
.btn[disabled]{background:var(--line);color:var(--mute);box-shadow:none;border-color:var(--line);cursor:default;transform:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* path */
.unit{margin-top:26px}
.uhead{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--hv);color:var(--hvInk);box-shadow:0 4px 0 var(--hvDk)}
.uhead.locked{background:var(--card);color:var(--mute);box-shadow:0 4px 0 var(--line)}
.uhead .lt{flex:1;line-height:1.25}.uhead .lt span{display:block;font-size:12px;font-weight:700;opacity:.7}
.uhead .lt strong{font-size:18px}
.gb{border:2px solid #0002;background:#fff3;border-radius:12px;min-height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:inherit}
.uhead.locked .gb{border-color:var(--line2);background:none}
.gb svg{width:20px;height:20px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:22px;padding:54px 0 8px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;width:74px;height:68px;border-radius:50%;border:0;background:var(--act);color:#fff;box-shadow:0 7px 0 var(--actDk);display:grid;place-items:center;transition:transform .06s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--actDk)}
.node svg{width:32px;height:32px}
.node.done{background:var(--hv);color:var(--hvInk);box-shadow:0 7px 0 var(--hvDk)}
.node.lock{background:var(--line);color:var(--mute);box-shadow:0 7px 0 var(--line2)}
.node.chest{background:none;box-shadow:none;width:80px}
.node.chest svg{width:64px;height:64px}
.node.next{outline:6px solid var(--actBg);outline-offset:4px}
.bub{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--bg);color:var(--act);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
.bub:after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@media(prefers-reduced-motion:no-preference){.bub{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-5px)}}}
.pop{position:relative;margin-top:18px;width:min(300px,86vw);background:var(--act);color:#fff;border-radius:16px;padding:14px 16px;z-index:3;animation:pop .18s ease-out}
.pop.done{background:var(--hv);color:var(--hvInk)}.pop.lock{background:var(--card);color:var(--mute);border:2px solid var(--line)}
.pop:before{content:"";position:absolute;bottom:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--act)}
.pop.done:before{border-bottom-color:var(--hv)}.pop.lock:before{border-bottom-color:var(--line)}
.pop strong{display:block;font-size:17px}.pop p{margin:2px 0 0;font-size:14px;opacity:.85}
.pop .btn{background:#fff;color:var(--act);box-shadow:0 4px 0 #0003}
.pop.done .btn{color:var(--hvInk)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
/* sheets */
.veil{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet h2{font-size:24px;margin-bottom:6px}
.fact{padding:12px 0;border-top:2px solid var(--line)}.fact b{display:block}.fact p{margin:4px 0 0;color:var(--mute);font-size:14px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
/* lesson */
.ls{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lt2{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.x{width:44px;height:44px;border:0;background:none;color:var(--mute);display:grid;place-items:center;flex:none}
.x svg{width:24px;height:24px}
.prog{flex:1;height:18px;border-radius:9px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--ok);transition:width .4s cubic-bezier(.3,1.5,.6,1)}
.prog i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:3px;background:#fff5}
.prog.hot i{background:var(--fire)}
.combo{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:12px;font-weight:800;color:var(--fire);text-transform:uppercase;letter-spacing:.06em;animation:pop .25s}
.lhearts.hit{animation:sh .4s}
.lb{flex:1;max-width:560px;width:100%;margin:0 auto;padding:14px 16px 24px}
.kind{font-size:13px;font-weight:800;color:var(--act);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.tag{background:var(--badBg);color:var(--bad);border-radius:8px;padding:1px 8px;font-size:11px}
.lb h2{font-family:Inter,sans-serif;font-stretch:100%;font-weight:800;font-size:22px;line-height:1.3;margin-bottom:22px}
.opts{display:grid;gap:12px}
.opt{position:relative;text-align:left;min-height:58px;padding:12px 16px 12px 52px;border-radius:16px;border:2px solid var(--line);background:var(--bg);box-shadow:0 4px 0 var(--line);font-size:16px;font-weight:600;transition:transform .05s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{position:absolute;left:12px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mute)}
.opt.sel{border-color:var(--act);background:var(--actBg);box-shadow:0 4px 0 var(--act);color:var(--act)}
.opt.sel .k{border-color:var(--act);color:var(--act)}
.opt.good{border-color:var(--ok);background:var(--okBg);box-shadow:0 4px 0 var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badBg);box-shadow:0 4px 0 var(--bad);color:var(--bad)}
.opt.gone{opacity:.3;pointer-events:none;box-shadow:none}
.tf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tf .opt{text-align:center;padding:12px;min-height:84px;font-size:20px;font-weight:800}.tf .opt .k{display:none}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px}
.mgrid .col{display:grid;gap:12px;align-content:start}
.mgrid .opt{padding:10px 12px;font-size:15px;text-align:center}
.num{display:flex;align-items:center;gap:10px}
.num input{flex:1;min-height:60px;font:800 24px Inter,sans-serif;padding:8px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.num span{font-weight:800;color:var(--mute);font-size:18px}
.sentence{font-size:20px;font-weight:600;line-height:2.4;margin-bottom:26px}
.slot{display:inline-block;min-width:76px;height:44px;vertical-align:middle;border-bottom:3px solid var(--line2);margin:0 4px;text-align:center}
.tile{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:16px;line-height:1;margin:0;vertical-align:middle;animation:pop .15s}
.slot .tile{margin-top:-2px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:16px;border-top:2px solid var(--line)}
.ghostt{display:inline-flex;min-height:44px;border-radius:12px;background:var(--line);padding:0 14px;align-items:center;color:transparent;font-weight:700}
.foot{border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto}
.foot.ok{background:var(--okBg);border-color:transparent;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.foot.no{background:var(--badBg);border-color:transparent;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.vrow{display:flex;align-items:center;gap:12px}
.vic{width:46px;height:46px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.vic svg{width:28px;height:28px}
.verdict{font-family:Archivo,sans-serif;font-stretch:112%;font-weight:800;font-size:24px}
.foot.ok .verdict,.foot.ok .vic{color:var(--ok)}.foot.no .verdict,.foot.no .vic{color:var(--bad)}
.foot p{margin:8px 0 0}.ans{font-weight:800}
.foot.ok p,.foot.no p{color:var(--ink)}
.ref{font-size:13px;color:var(--mute);margin-top:6px}
.foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 var(--okDk)}
.foot.no .btn{background:var(--bad);box-shadow:0 4px 0 var(--badDk)}
.hint{text-align:center;font-size:13px;color:var(--mute);font-weight:600}
/* end screens */
.end{max-width:560px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:10vh 16px 32px;text-align:center;display:flex;flex-direction:column}
.end .grow{flex:1}
.end h1{font-size:clamp(32px,9vw,46px);margin:18px 0 10px;color:var(--hvDk)}
.end h1.fire{color:var(--fire)}.end h1.gemh{color:var(--gem)}.end h1.badh{color:var(--bad)}
.end p{color:var(--mute);margin:0 auto 22px;max-width:34ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 18px}
.st{border:2px solid;border-radius:16px;overflow:hidden}
.st span{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;padding:4px}
.st b{display:block;font-family:Archivo,sans-serif;font-stretch:112%;font-size:24px;padding:10px 4px}
.st.y{border-color:var(--hv)}.st.y span{background:var(--hv);color:var(--hvInk)}.st.y b{color:var(--hvDk)}
.st.g{border-color:var(--ok)}.st.g span{background:var(--ok)}.st.g b{color:var(--ok)}
.st.b{border-color:var(--act)}.st.b span{background:var(--act)}.st.b b{color:var(--act)}
.big{width:150px;height:150px;margin:0 auto;display:grid;place-items:center;position:relative}
.big>svg:not(.mascot){width:150px;height:150px}.big .mascot{width:100%;height:100%}
.big b{position:absolute;inset:0;display:grid;place-items:center;padding-top:30px;font-family:Archivo,sans-serif;font-stretch:112%;font-size:44px;color:#fff}
@media(prefers-reduced-motion:no-preference){.big{animation:boing .6s cubic-bezier(.3,1.6,.5,1)}@keyframes boing{from{transform:scale(.3)}}}
.week{display:flex;justify-content:center;gap:8px;margin:6px 0 20px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--mute)}
.week i{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}
.week i.on{background:var(--fire)}.week i svg{width:18px;height:18px}
/* quests + profile */
.quest{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:2px solid var(--line)}
.quest:first-of-type{border-top:0}
.quest .qi{width:44px;height:44px;flex:none;color:var(--hvDk)}.quest .qi svg{width:44px;height:44px}
.quest .qb{flex:1}.quest strong{display:block;margin-bottom:6px}
.quest .meter i{background:var(--hv)}.quest.fin .meter i{background:var(--ok)}
.quest .rw{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--gem);font-size:14px}.quest .rw svg{width:18px;height:18px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pst{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.pst svg{width:28px;height:28px;flex:none}.pst b{display:block;font-size:20px;line-height:1.1}.pst span{font-size:13px;color:var(--mute)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px;margin-top:12px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--mute);font-weight:700}
.bars i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--act);min-height:3px}
.bars div.today i{background:var(--hv)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.sw{width:56px;height:32px;border-radius:16px;border:0;background:var(--line2);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]:after{left:28px}
.note{margin-top:24px;font-size:13px;color:var(--mute)}.note a{color:var(--act)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;animation:pop .2s}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

.pi{width:52px;height:52px;flex:none;background:#fff;border-radius:14px;padding:6px;box-shadow:0 3px 0 #0002;display:grid}
.pi svg{width:100%;height:100%}
.uhead.locked .pi{filter:grayscale(1);opacity:.6}
.ghd{display:flex;align-items:center;gap:12px;margin-bottom:6px}.ghd h2{margin:0}
.tab:not(.on) svg{filter:grayscale(1);opacity:.55}
.week i.on{background:#ffe3c2}
.mascot{display:block;width:100%;height:auto;overflow:visible}
.hello{display:flex;gap:12px;align-items:center;margin-bottom:14px}.hello .mascot{width:78px;flex:none}
.say{position:relative;flex:1;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;background:var(--bg)}
.say:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid var(--line);border-left:0}
.say:after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:8px solid var(--bg);border-left:0}
.ask{display:flex;gap:10px;align-items:flex-end;margin-bottom:18px}.ask .mas{width:80px;flex:none}
.ask .say:before,.ask .say:after{top:auto;bottom:18px}
.ask h2{font-size:19px!important;margin:0!important}
.fig2{background:#f4f5f7;color-scheme:light;--ink:#15171a;--mute:#5d6470;border:2px solid var(--line);border-radius:16px;padding:6px;margin:0 0 18px}
.fig2 svg{display:block;width:100%;height:auto;max-height:190px}
.buddy{position:absolute;top:-6px;width:92px;pointer-events:none}.buddy.l{right:calc(100% + 26px)}.buddy.r{left:calc(100% + 26px)}

@media(prefers-reduced-motion:no-preference){.buddy .mascot,.hello .mascot{animation:bob2 2.6s ease-in-out infinite}@keyframes bob2{50%{transform:translateY(-4px)}}
.mas.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes hop{40%{transform:translateY(-14px)}}}

.nodes{position:relative;min-height:240px}
.scene{position:absolute;top:58px;width:min(150px,37vw);pointer-events:none}.scene.l{left:-6px}.scene.r{right:-6px}.scene svg{width:100%;height:auto;display:block}
.scene.dim{filter:grayscale(.9);opacity:.45}
.node.learnn:not(.done):not(.lock){background:var(--gem);box-shadow:0 7px 0 light-dark(#067083,#1f97aa)}
.node.learnn svg{width:30px;height:30px}
.pop.rd{background:var(--gem)}.pop.rd:before{border-bottom-color:var(--gem)}.pop.rd .btn{color:var(--gem)}
.deckb .kick{font-size:13px;font-weight:800;color:var(--gem);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px}
.deckb h1{font-size:clamp(30px,8vw,40px);margin:0 0 10px}.deckb .lead{font-size:17px;margin:0 0 18px}
.pbig{width:88px;height:88px;padding:10px;margin-bottom:14px;border:2px solid var(--line)}
.fq{margin:0 0 6px;color:var(--mute);font-weight:600}

/* ===================== Playful world theme ===================== */
:root{--fun:Fredoka,'Nunito','Arial Rounded MT Bold',system-ui,sans-serif;--gold:#ffc800;--goldD:#d9a300}
h1,h2,.wd,.btn,.stat,.tab,.verdict,.lt strong,.bub,.pop strong,.opt,.tile,.kind,.st b,.st span,.fa,.divider,.hero strong,.say,.gb,.fq,.tag,.combo,.burst b,.quest strong,.pst b,.ghd h2,.chip b{font-family:var(--fun)!important;font-stretch:100%!important}
h1,h2{font-weight:700!important;letter-spacing:-.01em}
.btn{font-weight:600;letter-spacing:.06em;border-radius:18px;font-size:17px}
/* top bar: stat pills */
.bar{border-bottom:0;background:light-dark(#ffffffee,#111315ee);backdrop-filter:blur(8px)}
.bar h1{font-size:19px}
.stat{background:var(--card);border-radius:999px;padding:5px 11px 5px 7px;font-size:16px;font-weight:600}
.tabs{border-top:0;box-shadow:0 -6px 20px #0000000f}
.tab{font-family:var(--fun);font-size:13px;font-weight:600}
.tab svg{width:30px;height:30px;transition:transform .2s}
.tab.on{position:relative}.tab.on:before{content:"";position:absolute;inset:6px 18%;border-radius:16px;background:var(--actBg);z-index:-1}
.tab.on svg{transform:scale(1.12) translateY(-1px)}
/* greeting card */
.hello-card{border:0;background:linear-gradient(160deg,light-dark(#e8f3ff,#1a2233),light-dark(#f7fbff,#141a24));box-shadow:0 2px 0 var(--line)}
.say{border-width:2px;font-weight:500;font-size:16px}
.goalrow{display:flex;align-items:center;gap:14px;margin:2px 0 4px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font:700 17px var(--fun);color:var(--goldD)}
.gtx b{display:block;font:700 19px var(--fun)}.gtx span{color:var(--mute);font-size:14px}
/* sticky hero for the unit in view */
.hero{position:sticky;top:62px;z-index:15;margin:18px 0 0}
.hin{position:relative;display:flex;align-items:center;gap:10px;min-height:104px;padding:14px 16px;border-radius:24px;color:var(--on);background:linear-gradient(135deg,var(--c),var(--d));box-shadow:0 6px 0 color-mix(in srgb,var(--d) 80%,#000);overflow:hidden}
.hin:before,.hin:after{content:"";position:absolute;border-radius:50%;background:#ffffff1f}
.hin:before{width:130px;height:130px;left:-40px;top:-60px}.hin:after{width:70px;height:70px;left:46%;bottom:-36px}
.hl{flex:1;position:relative;z-index:1;line-height:1.2;padding-right:70px}
.hl span{font:600 13px var(--fun);opacity:.85}.hl strong{display:block;font:700 25px var(--fun);margin:1px 0 8px;line-height:1.05}
.hbar{height:10px;border-radius:6px;background:#ffffff4d;max-width:200px}.hbar i{display:block;height:100%;border-radius:6px;background:#fff}
.hl small{display:block;margin-top:5px;font:500 13px var(--fun);opacity:.9}
.hin .gb{position:relative;z-index:2;border:2px solid #ffffff66;background:#ffffff26;color:var(--on);min-height:36px;margin-top:8px;padding:0 10px;font-size:13px}
.hmas{position:absolute;right:-4px;bottom:-26px;width:104px;z-index:1}
.hero.swap .hin{animation:heroin .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes heroin{from{transform:scale(.96);opacity:.6}}
/* each Part is a world */
.unit,.uhead{display:none}
.world{position:relative;margin:16px -16px 0;padding:6px 16px 70px;overflow:hidden;background:linear-gradient(180deg,light-dark(var(--l),color-mix(in srgb,var(--c) 14%,#111315)) 0,light-dark(#fff,#111315) 92%)}
.divider{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin:8px 0 0;color:var(--d);font-size:14px;font-weight:600}
.divider:before,.divider:after{content:"";flex:1;height:2px;border-radius:1px;background:color-mix(in srgb,var(--c) 35%,transparent)}
.divider span{max-width:78%;text-align:center}
.hills{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;
background:radial-gradient(70% 90px at 18% 100%,color-mix(in srgb,var(--c) 26%,light-dark(#fff,#111315)) 0 98%,transparent 100%),radial-gradient(60% 70px at 82% 100%,color-mix(in srgb,var(--c) 18%,light-dark(#fff,#111315)) 0 98%,transparent 100%)}
.cloud{position:absolute;height:20px;border-radius:999px;background:light-dark(#fff,#ffffff14);pointer-events:none;opacity:.95}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud:before{width:26px;height:26px;left:8px;top:-12px}.cloud:after{width:18px;height:18px;left:28px;top:-7px}
.c1{width:56px;top:70px;left:8%}.c2{width:44px;top:180px;right:10%}.c3{width:36px;top:330px;left:40%;opacity:.7}
.world.locked .scene,.world.locked .hills{filter:grayscale(.9);opacity:.5}
.world.locked .divider{color:var(--mute)}.world.locked .divider:before,.world.locked .divider:after{background:var(--line)}
.nodes{padding-top:50px;gap:46px;min-height:260px}
.scene{top:70px;width:min(160px,38vw);z-index:1}
/* glossy 3D lesson buttons */
.node{width:78px;height:72px;color:var(--on);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 62%);box-shadow:0 8px 0 var(--d),0 12px 16px #0000001a;z-index:2}
.node:before{content:"";position:absolute;top:9px;left:17px;width:24px;height:11px;border-radius:50%;background:#ffffff70;transform:rotate(-22deg)}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--d)}
.node.done{color:#5a3d00;background:radial-gradient(circle at 35% 28%,#ffe98a,var(--gold) 62%);box-shadow:0 8px 0 var(--goldD),0 12px 16px #0000001a}
.node.lock{color:var(--mute);background:radial-gradient(circle at 35% 28%,light-dark(#fafafa,#3a3f45),light-dark(#dcdfe3,#2b2f34) 62%);box-shadow:0 8px 0 light-dark(#b9bdc3,#1c1f22)}
.node.lock:before{opacity:.5}
.node.learnn:not(.done):not(.lock){background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 62%);box-shadow:0 8px 0 var(--d),0 12px 16px #0000001a}
.node.next{outline:0}
.node.chest{background:none!important;box-shadow:none!important;width:84px}.node.chest:before{display:none}
.node.chest.ready svg{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-8deg) scale(1.05)}80%{transform:rotate(8deg) scale(1.05)}85%{transform:rotate(-5deg)}90%{transform:rotate(0)}}
.pulse{position:absolute;top:-14px;left:50%;width:106px;height:106px;margin-left:-53px;border-radius:50%;border:7px solid color-mix(in srgb,var(--c) 30%,transparent);pointer-events:none;z-index:1}
.bub{color:var(--d);border-color:color-mix(in srgb,var(--c) 40%,var(--line));font-family:var(--fun);font-weight:700;bottom:calc(100% + 18px)}
.bub:after{border-top-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.pop{background:var(--c);color:var(--on);border-radius:20px;box-shadow:0 6px 0 var(--d)}
.pop:before{border-bottom-color:var(--c)}.pop .btn{color:var(--d)}
.pop.rd{background:var(--c)}.pop.rd:before{border-bottom-color:var(--c)}.pop.rd .btn{color:var(--d)}
.pop.done{background:var(--gold);box-shadow:0 6px 0 var(--goldD)}.pop.done:before{border-bottom-color:var(--gold)}
/* lessons and Learn cards take their Part's colours */
.ls{background:linear-gradient(180deg,light-dark(var(--l,#fff),color-mix(in srgb,var(--c,#2b45ff) 12%,#111315)) 0,var(--bg) 260px)}
.prog{height:20px;background:light-dark(#00000014,#ffffff1f)}
.kind{color:var(--d,var(--act))}
.say{background:var(--bg)}
.ask .mas .mascot{animation:bob2 2.6s ease-in-out infinite}
.opt{border-radius:18px;min-height:60px;font-weight:500;font-size:17px;box-shadow:0 5px 0 var(--line);background:var(--bg)}
.opt .k{border-radius:9px;font-family:var(--fun)}
.opt.sel{border-color:var(--c,var(--act));background:color-mix(in srgb,var(--c,var(--act)) 12%,var(--bg));box-shadow:0 5px 0 var(--c,var(--act));color:var(--d,var(--act))}
.opt.sel .k{border-color:var(--c,var(--act));color:var(--d,var(--act))}
.tf .opt{min-height:96px;font-size:22px}
.tile{border-radius:14px;box-shadow:0 4px 0 var(--line);font-weight:500}
.slot{border-bottom-color:color-mix(in srgb,var(--c,#888) 50%,var(--line2))}
.ls .foot:not(.ok):not(.no) .btn:not([disabled]){background:var(--c,var(--act));color:var(--on,#fff);box-shadow:0 5px 0 var(--d,var(--actDk))}
.ls .foot .btn.ghost{background:var(--bg);color:var(--d,var(--act));box-shadow:0 4px 0 var(--line)}
.foot.ok,.foot.no{animation:sheetup .32s cubic-bezier(.2,1.25,.35,1)}
@keyframes sheetup{from{transform:translateY(100%)}}
.verdict{font-size:26px}
.vic{box-shadow:0 3px 0 #0000001a}
.fig2{border-radius:20px}
.deckb .pbig{border:0;box-shadow:0 6px 0 var(--d);background:#fff}
.deckb .kick{color:var(--d)}
.deckb .fa{color:var(--d)}
.burst{position:fixed;left:50%;top:58px;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:#fff;color:#ff8a00;box-shadow:0 8px 24px #0003;transform:translateX(-50%);pointer-events:none;animation:burst 1.5s ease-out forwards}
.burst svg{width:30px;height:30px}.burst b{font-size:20px}
@keyframes burst{0%{transform:translate(-50%,20px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.08);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
/* end screens */
.end h1{color:var(--d,var(--hvDk))}
.end #nx2:not([style]){background:var(--c,var(--act));color:var(--on,#fff);box-shadow:0 5px 0 var(--d,var(--actDk))}
.st{border-radius:18px}.st span{font-weight:600}
/* quests and profile */
.card{border-radius:24px;box-shadow:0 3px 0 var(--line)}
.quest .meter{height:14px}
.pst{border-radius:18px}
.lib a{border-radius:18px}
/* section lessons, Learn cards and Library */
.secpill{position:relative;z-index:2;margin:6px 0 -30px;padding:5px 12px;border-radius:999px;background:var(--bg);border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--d);font:600 13px var(--fun);max-width:92%;text-align:center;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 25%,var(--line))}

.pagechip{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,var(--bg));color:var(--d);margin:0 0 12px;font-size:14px}

.watch{display:grid;gap:10px}.watch div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:light-dark(#fff8db,#2e2810);border:2px solid #ffc80066}
.watch svg{width:28px;height:28px;flex:none}.watch p{margin:0;font-size:16px}
.secs{display:grid;gap:8px}.secs div{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:14px}
.secs b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on);font:700 14px var(--fun);flex:none}
.secs span{flex:1;line-height:1.25}.secs strong{display:block;font:600 15px var(--fun)}.secs small{color:var(--mute);font-size:12px}
.secs svg{width:22px;height:22px;color:var(--ok)}.secs .dn b{background:var(--gold);color:#5a3d00}
.tab svg{width:28px;height:28px}
.libhead input{width:100%;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 16px Inter,sans-serif;padding:0 14px}
.lpart{margin:0 0 12px;border-radius:20px;border:2px solid var(--line);background:var(--bg);overflow:hidden}
.lpart summary{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;list-style:none;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,var(--bg)),var(--bg))}

.lpart .pi{width:44px;height:44px;padding:5px;border-radius:12px}
.lpart .lt{flex:1;line-height:1.2}.lpart .lt small{display:block;color:var(--d);font:600 12px var(--fun)}.lpart .lt b{font:700 17px var(--fun)}
.node.final{width:90px;height:82px}.node.final svg{width:40px;height:40px}
.node.final:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px dashed color-mix(in srgb,var(--c) 55%,transparent);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.end.fin{padding-top:6vh;text-align:left}.end.fin .big{margin:0 auto}.end.fin h1,.end.fin>.grow>p,.fkick{text-align:center}
.fkick{font:700 13px var(--fun);color:var(--d);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.end.fin h1{margin:4px 0 6px}.fh{font:700 18px var(--fun);margin:18px 2px 8px}
.frow{border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}

.frow.weak{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 5%,var(--bg))}
.fr1{display:flex;align-items:center;gap:10px}.frt{flex:1;line-height:1.2}.frt b{display:block;font:700 15px var(--fun)}.frt small{color:var(--mute);font-size:12px}
.frs{font:700 15px var(--fun);color:var(--d)}.frow.weak .frs{color:var(--bad)}
.fbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 2px}.fbar i{display:block;height:100%;background:var(--c)}.frow.weak .fbar i{background:var(--bad)}
.fmiss{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:14px}.fmiss p{margin:0 0 3px;color:var(--mute);max-width:none;text-align:left}.fmiss b{display:block;font-weight:700}.fmiss span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.fbtns{display:flex;gap:8px;margin-top:10px}.fbtns .btn{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;padding:0 8px}.fbtns .btn svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.node.final:after{animation:none}}
.qzb{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 13px;border-radius:14px;border:0;background:var(--c);color:var(--on);font:700 14px var(--fun);box-shadow:0 4px 0 var(--d);cursor:pointer;transition:transform .08s,box-shadow .08s}
.qzb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--d)}.qzb svg{width:19px;height:19px}

.lsh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.lsh h3{flex:1;padding-top:6px}
.lpart .lt em{display:block;font:500 12px var(--fun);font-style:normal;color:var(--mute);margin-top:2px}

.jp.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--bg))}
.lpart .cnt{min-width:34px;height:26px;border-radius:13px;background:var(--c);color:var(--on);display:grid;place-items:center;font:700 13px var(--fun);padding:0 8px}
.lbody{padding:6px 14px 14px}

const A=window.REG_ART;if(A)Object.assign(I,A.ui,{target:A.ui.quest,user:A.ui.hat});
const mascot=m=>A?A.mascot(m):'',sceneArt=k=>A&&A.scene?A.scene(k):'',partIc=k=>A?A.part(k):'',diagram=(k,l)=>A?A.diagram(k,l):'';
const UNITS=window.REG_UNITS||[];
/* stable ids from question text, so progress survives edits to the bank */
const h=s=>{let x=5381;for(const c of s)x=(x*33+c.charCodeAt(0))>>>0;return x.toString(36)};
const LES=[];UNITS.forEach((u,ui)=>u.lessons.forEach((les,li)=>{const meta=Array.isArray(les)?null:les,qs=meta?meta.qs:les;qs.forEach(q=>q.id=u.k+':'+h(q.q+(q.p?JSON.stringify(q.p):'')));LES.push({ui,li,key:ui+'-'+(meta?meta.id:li),qs,meta})}));
const QBY={},QU={};LES.forEach(l=>l.qs.forEach(q=>{QBY[q.id]=q;QU[q.id]=l.ui}));
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const govLink=(d,cls='gov')=>`<a class="${cls}" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.t)} on GOV.UK ${ARROW}</a>`;
const docsOf=ui=>(UNITS[ui]&&UNITS[ui].docs)||[];

/* ---------- GOV.UK update check ----------
   Content in this app was checked against GOV.UK in November 2026.
   On open we ask GOV.UK's public content API for each Approved Document page's
   public_updated_at. Anything updated after 21 Nov 2026 gets a "May be out of date" badge.
   If the request is blocked (offline, or the page's security policy), we stay quiet. */
const CHECKED='November 2026',CUTOFF=Date.parse('2026-11-22T00:00:00Z'),GKEY='regs-trainer-govuk';
const govPages=ui=>docsOf(ui).filter(d=>/^https:\/\/www\.gov\.uk\/government\/(publications|collections)\//.test(d.url));
const apiPath=u=>u.replace('https://www.gov.uk/','').split(/[?#]/)[0];
let GOV={};try{GOV=JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){GOV={}}
const staleOf=ui=>govPages(ui).map(d=>({d,g:GOV[apiPath(d.url)]})).filter(o=>o.g&&o.g.t>=CUTOFF);
function govCheck(ui,inl){const pg=govPages(ui);if(!pg.length)return'';const st=staleOf(ui);
 return`<div class="gchk${inl?' inl':''}"><span>Checked against GOV.UK, ${CHECKED}</span>${pg.map(d=>`<a class="glive" href="${esc(d.url)}" target="_blank" rel="noopener">${pg.length>1?esc(d.t.replace(/^Approved Document /,'AD ')):'Live GOV.UK page'} ${ARROW}</a>`).join('')}${st.length?`<button class="gstale" data-gstale="${ui}">${WARN}May be out of date</button>`:''}</div>`}
function staleSheet(ui){const u=UNITS[ui],fmt=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
 sheet(`<h2>${esc(u.name)} may be out of date</h2><p class="small">GOV.UK has updated ${staleOf(ui).length>1?'these pages':'this page'} since the app was checked in ${CHECKED}. Lessons here may not reflect the change yet.</p>${staleOf(ui).map(({d,g})=>`<p style="margin:12px 0 6px"><b>${esc(d.t)}</b> · updated ${fmt(g.t)}</p>${(g.n||[]).map(n=>`<div class="gnote"><b>${fmt(n.t)}</b>${esc(n.note)}</div>`).join('')||'<p class="small">No change note was given.</p>'}<div class="govs"><a class="gov" href="${esc(d.url)}" target="_blank" rel="noopener">Read the change notes on GOV.UK ${ARROW}</a></div>`).join('')}<button class="btn" data-close>Got it</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gstale]');if(b){e.preventDefault();e.stopPropagation();staleSheet(+b.dataset.gstale)}},true);
async function govFetch(){const paths=[...new Set(UNITS.flatMap((u,ui)=>govPages(ui).map(d=>apiPath(d.url))))];if(!paths.length||!window.fetch)return;
 const before=JSON.stringify(GOV),out={...GOV};
 await Promise.allSettled(paths.map(async p=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch('https://www.gov.uk/api/'+p.replace(/^government\//,'content/government/'),{signal:c.signal});if(!r.ok)return;const j=await r.json(),t=Date.parse(j.public_updated_at);if(!t)return;
   const n=((j.details&&j.details.change_history)||[]).map(h=>({t:Date.parse(h.public_timestamp),note:String(h.note||'')})).filter(h=>h.t>=CUTOFF).slice(0,5);
   out[p]={t,n}}catch(e){}finally{clearTimeout(tm)}}));

 if(view!=='lesson'){const y=scrollY;render();scrollTo(0,y)}}

/* ---------- state ---------- */
const KEY='regs-trainer-v1',GOAL=20,MAXH=5,REFILL=30;
const QUESTS=[{id:'xp',name:'Earn 20 XP',n:20,get:()=>S.todayXp},{id:'combo',name:'Get 5 in a row',n:5,get:()=>S.bestCombo},{id:'les',name:'Finish 2 lessons',n:2,get:()=>S.lessonsToday}];
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const today=()=>dayOff(0),yday=()=>dayOff(-1);
const blank=()=>({xp:0,gems:0,streak:0,lastDay:'',todayDay:'',todayXp:0,bestCombo:0,lessonsToday:0,claimed:{},hearts:MAXH,heartsDay:'',done:{},chests:{},mistakes:{},read:{},taught:{},hist:{},sound:true,updated:0,qbest:{},last:-1,qseen:{},finals:{}});
function norm(o){const b=blank();o=o&&typeof o==='object'?o:{};for(const k in b)if(o[k]===undefined||o[k]===null||typeof o[k]!==typeof b[k])o[k]=b[k];return o}
let S=blank();try{S=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=blank()}
let ref=null,chain=Promise.resolve();
function roll(){const t=today();if(S.todayDay!==t){S.todayDay=t;S.todayXp=0;S.bestCombo=0;S.lessonsToday=0;S.claimed={}}if(S.heartsDay!==t){S.heartsDay=t;S.hearts=MAXH}}
function save(){S.updated=Date.now();const ks=Object.keys(S.hist).sort();while(ks.length>60)delete S.hist[ks.shift()];const snap=JSON.parse(JSON.stringify(S));try{localStorage.setItem(KEY,JSON.stringify(snap))}catch(e){}if(ref)chain=chain.then(()=>ref.set(snap)).catch(()=>{})}
function addXp(n){roll();let up=false;if(S.lastDay!==today()){S.streak=S.lastDay===yday()?S.streak+1:1;S.lastDay=today();up=true}S.todayXp+=n;S.xp+=n;S.hist[today()]=(S.hist[today()]||0)+n;return up}
const streak=()=>(S.lastDay===today()||S.lastDay===yday())?S.streak:0;
function newQuests(){const out=[];QUESTS.forEach(q=>{if(!S.claimed[q.id]&&q.get()>=q.n){S.claimed[q.id]=1;S.gems+=10;out.push(q)}});return out}
async function cloud(){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;const r=db.doc('data/users/'+id+'/progress');const sn=await r.get();ref=r;
if(sn.exists){const d=sn.data();if(d&&(d.updated||0)>(S.updated||0)){S=norm(JSON.parse(JSON.stringify(d)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(view!=='lesson')render()}else if(S.updated>((d&&d.updated)||0))save()}else if(S.updated)save()}catch(e){ref=null}}

/* ---------- sound + haptics ---------- */
let AC=null;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime;
seq.forEach(([f,d,type='sine',v=.18])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.75})}catch(e){}}
const SFX={tap:()=>tone([[660,.05,'triangle',.08]]),good:()=>tone([[784,.12],[1175,.22]]),bad:()=>tone([[220,.18,'square',.07],[180,.25,'square',.06]]),
done:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.35]]),gem:()=>tone([[1319,.08,'triangle'],[1760,.18,'triangle']]),fire:()=>tone([[392,.1],[523,.1],[659,.1],[784,.3]])};

let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<150)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- lesson engine ---------- */
let L=null;
function begin(qs,o){DK=null;if(o&&o.idx>=0)S.last=o.idx;L=Object.assign({qs,queue:qs.map((_,k)=>k),total:qs.length,right:0,wrong:0,seen:new Set(),missed:new Set(),combo:0,best:0,t0:Date.now(),practice:false,idx:-1},o);view='lesson';ask()}
/* ---------- quiz generator: a fresh mix from the whole unit every time ---------- */
const TOKRE=/(?<![\w.:\-–\/])(\d+(?:\.\d+)?)(mm|m²|m³|m|°C|°|kN\/m²|N|%|dB|kW)(?![A-Za-z0-9²³\/])|(?<![\w.:\/])1:(\d+)(?!\d)/g;
const tokKind=m=>m[3]?':':m[2],tokVal=m=>parseFloat(m[3]||m[1]);
const fmtTok=(v,k)=>k===':'?'1:'+v:String(+v.toFixed(2))+k;
const fmtNum=(a,u)=>a+(/^[a-z]{2,}/i.test(u)&&u!=='mm'&&u!=='dB'&&u!=='kW'?' ':'')+u;
function tweak(v,k){const st=k===':'?(v>=20?5:v>=10?3:1):k==='mm'?(v>=1000?100:v>=200?50:v>=50?10:5):k==='m'||k==='m²'?(v>=10?(v>=100?50:5):.5):k==='°'||k==='°C'?(v>=20?5:2):k==='%'?10:Math.max(1,Math.round(v*.2));
 return [v+st,v-st,v+2*st,v-2*st,v+3*st].filter(x=>x>0&&x!==v)}
function nearest(v,vals,k){const seen=new Set([v]),out=[];vals.filter(x=>x>0).sort((a,b)=>Math.abs(Math.log(a/v))-Math.abs(Math.log(b/v))).forEach(x=>{if(!seen.has(x)&&out.length<6){seen.add(x);out.push(x)}});
 tweak(v,k).forEach(x=>{if(!seen.has(x)&&out.length<6){seen.add(x);out.push(x)}});return shuf(out.slice(0,4)).slice(0,3)}
function stmt(stem,ans){const s=stem.trim();return /(…|\.\.\.)$/.test(s)?s.replace(/(…|\.\.\.)$/,'')+' '+ans:s.replace(/\?$/,'')+': '+ans}
function textsOf(l,ui){const m=l?l.meta:null;if(m)return[m.intro].concat(m.watch||[]);return l===null?[UNITS[ui].intro||'']:[]}
function unitPools(ui){if(!unitPools.c)unitPools.c={};if(unitPools.c[ui])return unitPools.c[ui];const tok={},num={};
 const ls=LES.filter(l=>l.ui===ui),texts=[UNITS[ui].intro||''];ls.forEach(l=>{texts.push(...textsOf(l,ui));l.qs.forEach(q=>{if(q.x)texts.push(q.x);if(q.t==='mc')texts.push(q.o[0]);if(q.t==='num')(num[q.u]=num[q.u]||[]).push(parseFloat(q.a[0]))})});
 texts.forEach(t=>{for(const m of String(t).matchAll(TOKRE)){const k=tokKind(m);(tok[k]=tok[k]||new Set()).add(tokVal(m))}});
 const P={tok:Object.fromEntries(Object.entries(tok).map(([k,s])=>[k,[...s]])),num};return unitPools.c[ui]=P}
function varyQ(q,ui){const P=unitPools(ui),forms=[()=>q],plain=!/\b(how many|how far|how long|what|which|who|why|where|when)\b/i.test(q.q);
 if(q.t==='mc'&&q.o.length>1&&plain)forms.push(()=>{const ok=Math.random()<.5,opt=ok?q.o[0]:q.o[1+(Math.random()*(q.o.length-1)|0)];return Object.assign({},q,{t:'tf',q:stmt(q.q,opt),a:ok,x:'Answer: '+q.o[0]+'. '+(q.x||'')})});
 if(q.t==='num'){const v=parseFloat(q.a[0]),ds=nearest(v,P.num[q.u]||[],q.u==='°C'?'°C':q.u);
  if(ds.length>=3)forms.push(()=>Object.assign({},q,{t:'mc',o:[fmtNum(q.a[0],q.u)].concat(ds.map(d=>fmtNum(String(+d.toFixed(2)),q.u)))}));
  if(ds.length&&plain)forms.push(()=>{const ok=Math.random()<.5;return Object.assign({},q,{t:'tf',q:stmt(q.q,fmtNum(ok?q.a[0]:String(+ds[0].toFixed(2)),q.u)),a:ok,x:'Answer: '+fmtNum(q.a[0],q.u)+'. '+(q.x||'')})})}
 return forms[Math.random()*forms.length|0]()}
function gapItems(l,ui){const u=UNITS[ui],m=l?l.meta:null,doc=m&&m.doc?m.doc:(docsOf(ui)[0]||{}).url,ref=m?'AD '+u.k+(m.vol?' Vol '+m.vol:'')+' · '+m.sec.split(' · ')[0]+', p.'+m.page:unitLabel(u,ui);
 const out=[],src=textsOf(l,ui).map(t=>[t,7]).concat(l?l.qs.map(q=>[q.x||'',10]):[]);src.forEach(([t,minW])=>String(t).split(/(?<=[.!?])\s+(?=[A-Z])/).forEach(sen=>{const ms=[...sen.matchAll(TOKRE)].filter(mm=>mm.index>0);if(!ms.length||sen.length>230||sen.split(/\s+/).length<minW||sen.includes('___'))return;
  out.push({key:'g:'+h(sen),make:()=>{const P=unitPools(ui),c=shuf(ms).find(mm=>sen.split(mm[0]).length===2);if(!c)return null;const k=tokKind(c),v=tokVal(c),ds=nearest(v,P.tok[k]||[],k);if(ds.length<3)return null;
   return{t:'build',id:'g:'+h(sen),q:sen.slice(0,c.index)+'___'+sen.slice(c.index+c[0].length),a:[c[0]],d:ds.map(d=>fmtTok(d,k)),r:ref,doc}}})}));return out}
function quizItems(l,ui){const li=LES.indexOf(l),its=l.qs.map(q=>({key:q.id,make:()=>varyQ(q,ui)})).concat(gapItems(l,ui));return its.map(it=>({key:it.key,make:()=>{const q=it.make();return q?Object.assign({},q,{_l:li}):null}}))}
function buildQuiz(groups,n){const pick=[],now=Date.now(),age=k=>(S.qseen[k]||0)-Math.random()*864e5*2;groups=shuf(groups.filter(g=>g.length)).map(g=>g.slice().sort((a,b)=>age(a.key)-age(b.key)));
 let gi=0,guard=0;while(pick.length<n&&groups.some(g=>g.length)&&guard++<500){const g=groups[gi++%groups.length];if(!g.length)continue;const it=g.shift(),q=it.make();if(q){pick.push(q);S.qseen[it.key]=now}}
 save();return shuf(pick)}
function unitQuiz(ui,back){SFX.tap();const ls=LES.filter(l=>l.ui===ui),groups=ls.map(l=>quizItems(l,ui));if(!ls.some(l=>l.meta))groups.push(gapItems(null,ui));const qs=buildQuiz(groups,10);if(!qs.length)return toast('No questions here yet');S.last=LES.findIndex(l=>l.ui===ui);begin(qs,{practice:true,quiz:ui,sec:-1,back})}
function finalTest(ui){SFX.tap();const ls=LES.filter(l=>l.ui===ui),groups=ls.map(l=>quizItems(l,ui));if(!ls.some(l=>l.meta))groups.push(gapItems(null,ui));const qs=buildQuiz(groups,10);if(!qs.length)return toast('No questions here yet');S.last=LES.findIndex(l=>l.ui===ui);begin(qs,{practice:true,quiz:ui,sec:-1,final:true})}
function secQuiz(i,back){SFX.tap();const l=LES[i];S.last=i;const its=quizItems(l,l.ui),n=Math.min(10,its.length);begin(buildQuiz([its],n),{practice:true,quiz:l.ui,sec:i,back})}
const qbestOf=k=>S.qbest[k]>=0?S.qbest[k]:null;
function start(i){const l=LES[i];if(l&&l.meta&&!S.taught[l.key]&&!S.done[l.key])return lessonDeck(i);startQuiz(i)}
function startQuiz(i){roll();if(S.hearts<=0)return outHearts();begin(LES[i].qs.slice(),{idx:i,redo:!!S.done[LES[i].key]})}
function practice(only,mixed){roll();let ids=mixed?[]:Object.keys(S.mistakes).filter(id=>QBY[id]);
if(!ids.length&&!only)ids=LES.filter(l=>S.done[l.key]).flatMap(l=>l.qs.map(q=>q.id));
if(!ids.length)return toast('Nothing to practise yet');begin(shuf(ids).slice(0,8).map(id=>QBY[id]),{practice:true})}

function ask(){if(!L.queue.length)return finish();const qi=L.queue[0],q=L.qs[qi];L.cur=q;L.sel=null;L.again=L.seen.has(qi);L.seen.add(qi);
const kind={mc:'Choose the right answer',tf:'True or false?',num:'Type the figure',match:'Tap the matching pairs',build:'Fill the gaps'}[q.t];
let body='';
if(q.t==='mc'){L.opts=shuf(q.o.map((t,k)=>({t,ok:k===0})));body=`<div class="opts">${L.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${esc(o.t)}</button>`).join('')}</div>`}
else if(q.t==='tf'){L.opts=[{t:'True',ok:q.a===true},{t:'False',ok:q.a===false}];body=`<div class="opts tf">${L.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${o.t}</button>`).join('')}</div>`}
else if(q.t==='num'){body=`<div class="num"><input id="ni" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><span>${esc(q.u)}</span></div>`}
else if(q.t==='build'){L.bank=shuf(q.a.concat(q.d).map((t,k)=>({t,k})));L.fill=q.a.map(()=>null);body=`<div class="sentence" id="sen"></div><div class="bank" id="bank"></div>`}
else{L.left=shuf(q.p.map((p,k)=>({t:p[0],k})));L.right=shuf(q.p.map((p,k)=>({t:p[1],k})));L.matched=0;L.pick=null;

function buildIndex(){const docs=[],df={},sur={_all:{}};for(const k in SYN0){const t=toks(k)[0];SYN[t]=SYN0[k]}
 const add=(o,fields)=>{o.i=docs.length;const tf={};for(const [txt,w] of fields)for(const t of toks(txt,sur)){if(STOP.has(t))continue;if(!tf[t]||tf[t]<w)tf[t]=w}o.tf=tf;docs.push(o);for(const t in tf)df[t]=(df[t]||0)+1};
 LES.forEach((l,li)=>{const u=UNITS[l.ui],uf=[u.name,.6],m=l.meta,sn=m?m.sec+' '+m.name:'';
  if(m){add({k:'s',li,ui:l.ui,id:'s'+li},[[sn,3],[m.intro,1],uf]);m.watch.forEach((w,wi)=>add({k:'w',li,ui:l.ui,id:'w'+li+'_'+wi,w},[[w,2],[sn,.8],uf]))}
  l.qs.forEach(q=>{if(q.t==='match'){q.p.forEach(pp=>add({k:'p',li,ui:l.ui,id:m?'s'+li:'',p:pp},[[pp.join(' '),2.2],uf]));return}
   add({k:'f',li,ui:l.ui,id:fid(q),q},[[answerOf(q),2.2],[q.t==='mc'?q.q:'',1.4],[q.x||'',1],[q.r||'',1.2],[sn,.8],uf])})});
 const all=sur._all;delete sur._all;return{docs,df,sur,vocab:Object.keys(df),surf:Object.entries(all).filter(([w,t])=>df[t]&&!/^\d/.test(w))}}
const fid=q=>'f'+q.id.replace(/[^a-zA-Z0-9]/g,'_');
function edit1(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let pp=null,prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const cur=[i];let mn=i;for(let j=1;j<=b.length;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));if(pp&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])cur[j]=Math.min(cur[j],pp[j-2]+1);if(cur[j]<mn)mn=cur[j]}if(mn>max)return max+1;pp=prev;prev=cur}return prev[b.length]}
function runSearch(raw){const ix=SIX||(SIX=buildIndex());raw=String(raw||'').toLowerCase().trim();const out={res:[],syn:[],fix:[],part:null,miss:[]};if(!raw)return out;
 const pm=raw.match(/\b(?:part|ad|approved document)\s+(hr|[a-z7])\b/);if(pm){const k=pm[1].toUpperCase();if(UNITS.some(u=>u.k===k)){out.part=k;raw=raw.replace(pm[0],' ')}}
 const qt=[...new Set(toks(raw).filter(t=>!STOP.has(t)))],endsTyping=/[a-z0-9]$/.test(raw),groups=[],syn=new Set(),fix=new Set();
 qt.forEach((t,i)=>{const g=new Map(),put=(k,w)=>{if(ix.df[k]&&(g.get(k)||0)<w)g.set(k,w)};put(t,VAGUE.has(t)?.45:1);
  (SYN[t]||'').split(' ').forEach(x=>toks(x).forEach(y=>{if(y===t||!ix.df[y])return;put(y,.85);syn.add(ix.sur[y]||y)}));
  if(!g.size&&!/^\d/.test(t)&&t.length>=3){const mx=t.length>=8?2:1;let best=mx+1,cands=[];for(const [w,v] of ix.surf){if(w.length<4||STOP.has(w)||STOP.has(v))continue;const d=Math.min(edit1(t,w,mx),edit1(t,v,mx));if(d<best){best=d;cands=[v]}else if(d===best&&!cands.includes(v))cands.push(v)}
   cands.sort((x,y)=>((ix.sur[x]||x).slice(0,2)===t.slice(0,2)?0:1)-((ix.sur[y]||y).slice(0,2)===t.slice(0,2)?0:1)||ix.df[y]-ix.df[x]);
   if(best<=mx)cands.slice(0,t.length<=4?1:2).forEach(v=>{put(v,.75);fix.add(ix.sur[v]||v);(SYN[v]||'').split(' ').forEach(x=>toks(x).forEach(y=>put(y,.65)))})}
  if(i===qt.length-1&&endsTyping&&t.length>=3&&!/^\d/.test(t)){let n=0;for(const v of ix.vocab)if(v!==t&&v.startsWith(t)&&n<12){put(v,.7);n++}}
  if(g.size)groups.push(g);else out.miss.push(t)});

 for(const d of ix.docs){const uk=UNITS[d.ui].k;if(out.part&&uk!==out.part)continue;let sc=0,hit=0,hits=new Set();

  if(groups.length&&!hit)continue;sc=groups.length?sc*Math.pow(hit/groups.length,2)*KB[d.k]:(d.k==='s'?2:1);res.push({d,sc,hits})}

function finish(res){res.sort((a,b)=>b.sc-a.sc);const seen=new Set();return res.filter(r=>{const key=r.d.k+(r.d.id||'')+(r.d.p?r.d.p.join():'');if(seen.has(key))return false;seen.add(key);return true})}
function hl(text,hits){return String(text).split(/([A-Za-z0-9².]+)/).map((w,i)=>{if(i%2===0)return esc(w);const t=toks(w);return t.some(x=>hits.has(x))?`<mark>${esc(w)}</mark>`:esc(w)}).join('')}
const clip=(t,n=170)=>{t=String(t||'');return t.length>n?t.slice(0,t.lastIndexOf(' ',n)>60?t.lastIndexOf(' ',n):n)+'…':t};

/* ---------- meaning search ----------
   A small sentence model (all-MiniLM-L6-v2, run on the phone by transformers.js) turns every fact
   into a "meaning fingerprint" once, in a background worker, and saves them on the device.
   Searches then match on meaning as well as words. It downloads about 45MB once, on Wi-Fi by default.
   If anything fails it switches itself off and word search carries on as normal. */
const SEM_LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/dist/transformers.min.js',SEM_MODEL='Xenova/all-MiniLM-L6-v2',DIM=384;
const SEM={state:'off',pct:0,vecs:null,w:null,seq:0,wait:{}};
function semStatus(){const el=$('#semst');if(!el)return;const st=SEM.state;
 el.innerHTML=st==='on'?'✓ Understands meaning, not just exact words':st==='loading'?`Meaning search is setting up in the background${SEM.pct?` (${SEM.pct}%)`:''}. Word search works now.`:st==='wait'?`Meaning search sets itself up on Wi-Fi (about 45MB, once). <button class="linkb" id="semgo">Set up now</button>`:'';
 const b=$('#semgo');if(b)b.onclick=()=>startSemantic(true)}
const idbKV=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('regs-trainer',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=()=>{db.close();res(q&&q.result)};tx.onerror=()=>{db.close();rej(tx.error)}}});
function semText(d){const u=UNITS[d.ui],m=LES[d.li].meta,nm=u.name+': ';
 if(d.k==='s')return nm+m.sec+'. '+m.name+'. '+m.intro;if(d.k==='w')return nm+d.w+(m?' ('+m.name+')':'');if(d.k==='p')return nm+d.p.join(' — ');
 const q=d.q;return(nm+(q.t==='mc'?q.q+' ':'')+answerOf(q)+'. '+(q.x||'')).slice(0,600)}
function semCall(msg,transfer){return new Promise((res,rej)=>{const id=++SEM.seq;SEM.wait[id]={res,rej};SEM.w.postMessage({...msg,id},transfer||[])})}
function semFail(){SEM.state='failed';try{SEM.w&&SEM.w.terminate()}catch(e){}SEM.w=null;for(const k in SEM.wait){SEM.wait[k].rej(new Error('off'))}SEM.wait={};semStatus()}
async function startSemantic(force){if(SEM.state==='loading'||SEM.state==='on')return;
 if(!window.Worker||!window.indexedDB||!/^https:|^http:\/\/localhost/.test(location.href)){SEM.state='failed';return}
 const c=navigator.connection;if(!force&&c&&(c.saveData||c.type==='cellular'||/2g/.test(c.effectiveType||''))){SEM.state='wait';semStatus();return}
 SEM.state='loading';SEM.pct=0;semStatus();
 try{const ix=SIX||(SIX=buildIndex()),texts=ix.docs.map(semText),key='v1|'+SEM_MODEL+'|'+h(texts.join('\n'));
  const src=`import{pipeline,env}from'${SEM_LIB}';env.allowLocalModels=false;let ex;
self.onmessage=async e=>{const m=e.data;try{if(m.t==='init'){ex=await pipeline('feature-extraction','${SEM_MODEL}',{dtype:'q8',progress_callback:p=>{if(p.status==='progress'&&/onnx$/.test(p.file||''))self.postMessage({t:'dl',p:p.progress})}});self.postMessage({t:'ok',id:m.id})}
else if(m.t==='embed'){const o=await ex(m.texts,{pooling:'mean',normalize:true});const d=new Float32Array(o.data);self.postMessage({t:'ok',id:m.id,data:d},[d.buffer])}}catch(err){self.postMessage({t:'err',id:m.id,msg:String(err&&err.message||err)})}};`;

  else{const V=new Float32Array(texts.length*DIM);for(let i=0;i<texts.length;i+=16){const d=await semCall({t:'embed',texts:texts.slice(i,i+16)});V.set(d,i*DIM);SEM.pct=60+Math.round(40*Math.min(1,(i+16)/texts.length));semStatus()}
   SEM.vecs=V;try{await idbKV('readwrite',st=>st.put({key,vecs:V},'sem'))}catch(e){}}
  SEM.state='on';semStatus();if(view==='search'&&sQ.trim())drawResults()}catch(e){semFail()}}
async function semQuery(q){const d=await semCall({t:'embed',texts:[q]});return d}
function hybrid(r,qv){const ix=SIX,V=SEM.vecs,N=ix.docs.length,sims=new Float32Array(N);let mx=0;

 app.innerHTML=shell(`<div class="card shead"><h2>Search the regs</h2><div class="sbox">${SEARCHIC}<input id="sq" type="search" placeholder="e.g. how high should a banister be" value="${esc(sQ)}" aria-label="Search the regulations" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div><p class="snote" id="snote" aria-live="polite"></p><p class="snote" id="semst"></p></div><div id="sres"></div>`);
